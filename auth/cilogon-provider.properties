auth.method=openid
type=openid
provider.id=cilogon
visible=true
auto.enabled=true
auto.verified=true
# Name displayed in the UI
name=OpenID Authentication Provider
# Toggle username & password login visibility
disableUsernamePasswordLogin=false
# List of providers that appear on the login page, see options below.

auto.enabled=true
auto.verified=true

# Site URL - the main domain, needed to build the pre-established URL below.
siteUrl=http://localhost
preEstablishedRedirUri=/openid-login

# OpenID Configuration
openid.cilogon.clientId=
openid.cilogon.clientSecret=
openid.cilogon.accessTokenUri=https://test.cilogon.aaf.edu.au/oauth2/token
openid.cilogon.userAuthUri=https://test.cilogon.aaf.edu.au/authorize
openid.cilogon.scopes=openid,profile,email,org.cilogon.userinfo
openid.cilogon.link=<a style="color: #777; width:100%; margin:0 0 20px 0; font-size: 15px; border-radius: 50px; text-indent: 10px; font-weight: bold; border: none; display: inline-block; text-align: center; vertical-align: middle; -webkit-user-select:none; -moz-user-select: none; -ms-user-select: none; user-select: none; background-color: #fff; padding: 0.375 rem 0.75 rem; font-size: 1rem; line-height: 1.5; border-radius: 0.25 rem; box-shadow: 0px 8px 15px rgba(0, 0, 0, 0.1); transition: color .15s ease-in-out,background-color .15s ease-in-out,border-color .15s ease-in-out,box-shadow .15s ease-in-out;" href="/openid-login?providerId=cilogon"> <img src="/images/aaf_service_223x54.png" style="display: inline; cursor: pointer; position: relative; vertical-align:middle; width:50px"/><p style="display:inline;">Sign in with the AAF/CILogon</p></a>
# Flag that sets if we should be checking email domains 
openid.cilogon.shouldFilterEmailDomains=false
# Domains below are allowed to login, only checked when 'shouldFilterEmailDomains' is true
openid.cilogon.allowedEmailDomains=redboxresearchdata.com.au
# Flag to force the user creation process, normally this should be set to true
openid.cilogon.forceUserCreate=true
# Flag to set the enabled property of new users, set to false to allow admins to manually enable users before allowing logins, set to true to allow access right away
openid.cilogon.userAutoEnabled=false
# Flag to set the verified property of new users
openid.cilogon.userAutoVerified=false
# Property names to use when creating users
openid.cilogon.emailProperty=email
openid.cilogon.givenNameProperty=given_name
openid.cilogon.familyNameProperty=family_name
openid.cilogon.usernamePattern=[sub]

#openid.cilogon.emailProperty=OIDC_CLAIM_email
#openid.cilogon.givenNameProperty=OIDC_CLAIM_given_name
#openid.cilogon.familyNameProperty=OIDC_CLAIM_family_name
#openid.cilogon.usernamePattern=[OIDC_CLAIM_uid]

